[package]
name = "studio-workbench"
version = "0.0.0"
edition = "2024"
publish = false
# One test binary, `tests/main.rs`, that declares every file beside it.
autotests = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
studio-test-support = { path = "../test-support" }

[[test]]
name = "it"
path = "tests/main.rs"
