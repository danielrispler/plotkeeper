[package]
name = "studio-workbench"
version = "0.0.0"
edition = "2024"
publish = false
# One test binary, `tests/main.rs`, that declares every file beside it.
autotests = false

[dependencies]
# The runner kills a process group.
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
studio-test-support = { path = "../test-support" }

[[test]]
name = "it"
path = "tests/main.rs"

[lints]
workspace = true
