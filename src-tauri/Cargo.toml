[package]
name = "studio"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
studio-core = { path = "../core" }
studio-hook = { path = "../hook" }
studio-understanding = { path = "../understanding" }
studio-terminal-daemon = { path = "../terminal-daemon" }
studio-workbench = { path = "../workbench" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonc-parser = { version = "0.34", features = ["cst"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
dispatch2 = "0.3"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
