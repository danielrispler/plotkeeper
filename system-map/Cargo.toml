[package]
name = "studio-system-map"
version = "0.0.0"
edition = "2024"
publish = false
# One test binary, `tests/main.rs`, that declares every file beside it.
autotests = false

[lib]
name = "system_map"

[[bin]]
name = "system-map"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The one runner of `git` and `gh`.
studio-workbench = { path = "../workbench" }
# Commit mode writes a commit's manifests to a temporary folder for `cargo metadata`.
tempfile = "3"
# `pyproject.toml` is parsed as TOML for the Python extractor (spec #589, "Declared layouts").
toml = { version = "1.2.3", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
studio-test-support = { path = "../test-support" }

[[test]]
name = "it"
path = "tests/main.rs"

[lints]
workspace = true
