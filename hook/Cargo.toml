[package]
name = "studio-hook"
version = "0.0.0"
edition = "2024"
publish = false
# One test binary, `tests/main.rs`, that declares every file beside it.
autotests = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
studio-test-support = { path = "../test-support" }

[[test]]
name = "it"
path = "tests/main.rs"
