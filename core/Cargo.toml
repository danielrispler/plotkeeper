[package]
name = "studio-core"
version = "0.0.0"
edition = "2024"
publish = false
# One test binary: every file of `tests/` is a module of `tests/main.rs`.
autotests = false

[[test]]
name = "it"
path = "tests/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
