name: npm package

# Builds plotkeeper's npm packages (#706): the launcher `plotkeeper` and one platform package per platform, the
# universal macOS binaries packed on macOS and each Linux one, static musl binaries, on its own architecture's runner.
# On every run it installs them with no Rust on the PATH on macOS Apple silicon and Intel and on Linux x64 and arm64
# (scripts/npm/smoke.sh, #368). It publishes to the npm registry only when Daniel runs it by hand from main with
# "publish" ticked, by npm trusted publishing with no token (docs/studio/development.md, "Cutting a release"); a run by
# hand without it, from any branch, is a dry run that packs and smokes only.
# On such a publish dispatch, the release commit guard fails the run before building unless HEAD is the Release PR's
# commit, the one that changed npm/package.json's version (#512): a change merged after it would ship under the
# release's notes. The platform packages are published before the launcher that asks for them, and a package npm
# already has at this version is skipped, so a publish that failed partway is retried with "Re-run failed jobs"
# (`gh run rerun <id> --failed`). After npm accepts the versions, the `release` job tags vX.Y.Z at the run's commit
# and creates its GitHub Release from CHANGELOG.md's section; a failed `release` is retried the same way.
# It runs on each push to main, by hand, and for a ready pull request that touches what the package is built from:
# the dependencies, the toolchain, the package, its scripts, the README/LICENSE bundled into it, and the plugins
# `plotkeeper install` renders. A pull request's other changes, an Intel-only build break among them, show here only
# after the merge to main.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested tarball to the npm registry
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Paths apply in order, so `!archive/**` comes last: an archived Cargo.toml does not run it.
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - rust-toolchain.toml
      - "package*.json"
      - "npm/**"
      - "scripts/npm/**"
      - "plugin*/**"
      - README.md
      - LICENSE
      - .github/workflows/release.yml
      - "!archive/**"
  push:
    branches: [main]
    paths: ["**", "!**.md", "README.md", "!archive/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pack:
    # As in studio.yml: a draft pull request skips, and `smoke` and `publish` after it.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      matrix:
        include:
          # Both macOS architectures build on one runner, into universal binaries.
          - { runner: macos-latest, platform: darwin, targets: aarch64-apple-darwin x86_64-apple-darwin }
          - { runner: ubuntu-latest, platform: linux-x64, targets: x86_64-unknown-linux-musl }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64, targets: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # HEAD's parent, for the release commit guard: a single-commit checkout has none to compare with.
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # The release commit guard, on the publish gate: fails with "main moved past the Release PR, run /release again"
      # unless HEAD's commit changed npm/package.json's version.
      - if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        run: node scripts/npm/release.mjs guard
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache-workspaces: . -> target
      - run: rustup target add ${{ matrix.targets }}
      # musl-gcc, for ring's C code in a static musl build (scripts/npm/pack.sh).
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: npm ci
      # The launcher package and this platform's package.
      - run: npm run pack:npm -- out
      - uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.platform }}
          path: out/*.tgz
          if-no-files-found: error

  smoke:
    needs: pack
    strategy:
      matrix:
        include:
          # Apple silicon and Intel run the same universal package.
          - { runner: macos-latest, platform: darwin }
          - { runner: macos-26-intel, platform: darwin }
          - { runner: ubuntu-latest, platform: linux-x64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: npm-${{ matrix.platform }}
          path: out
      # The script keeps the runner's Rust off the PATH, as on a machine with no Rust toolchain.
      - run: sh scripts/npm/smoke.sh out

  publish:
    needs: smoke
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # npm trusted publishing authenticates through the job's OIDC token, and npm's provenance statement needs it.
      id-token: write
    steps:
      # No `registry-url`: npm's default registry is npmjs.org, and setup-node would write an `.npmrc` that sends
      # `NODE_AUTH_TOKEN`, a token this job does not have.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Trusted publishing needs npm 11.5.1 or later; Node 22's npm is 10.
      - run: npm install -g npm@^11.5.1
      # Each pack job's artifact into out/npm-<platform>/.
      - uses: actions/download-artifact@v8
        with:
          pattern: npm-*
          path: out
      # The tarballs the smoke jobs tested, not a rebuild: the platform packages first, then the launcher from the
      # macOS artifact, so the launcher is never on npm before a package it asks for. One npm already has at this
      # version is skipped. No token: npm trusted publishing, configured on npmjs.com for each of the four packages
      # with this repository's release.yml, authenticates it (docs/studio/development.md, "Cutting a release").
      # `./`: npm reads a bare `out/plotkeeper-<version>.tgz` as the GitHub repository `out/plotkeeper-<version>.tgz`
      # and fails in `git ls-remote` (#441's first workflow publish, run 45486175800).
      - run: |
          version=$(tar -xOzf out/npm-darwin/plotkeeper-[0-9]*.tgz package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          for package in npm-darwin/plotkeeper-darwin npm-linux-x64/plotkeeper-linux-x64 npm-linux-arm64/plotkeeper-linux-arm64 npm-darwin/plotkeeper; do
            name=${package#*/}
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "$name@$version is already on npm"
              continue
            fi
            npm publish "./out/$package-$version.tgz" --provenance --access public
          done

  release:
    needs: publish
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    # Only git, gh and node: no macOS runner needed.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Pushes the tag and creates the GitHub Release.
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Tags vX.Y.Z at the commit the run packed and published, and creates its Release from CHANGELOG.md's section.
      # Idempotent: a tag at this commit is kept, one at another commit fails, an existing Release is left alone, and a
      # missing changelog section fails (scripts/npm/release.mjs).
      - run: node scripts/npm/release.mjs tag "$(node -p 'require("./npm/package.json").version')" "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
