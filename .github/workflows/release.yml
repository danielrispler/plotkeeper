name: npm package

# Builds the npm package with universal macOS binaries, packs it, and installs the tarball on an Apple silicon and an
# Intel runner with no Rust on the PATH (scripts/npm/smoke.sh, #368), on every run. It publishes to the npm registry
# only when Daniel runs it by hand from main with "publish" ticked, by npm trusted publishing with no token
# (docs/studio/development.md, "Cutting a release").
# It runs on each push to main, by hand, and for a ready pull request that touches what the package is built from:
# the dependencies, the toolchain, the package, its scripts, the README/LICENSE bundled into it, and the plugins
# `plotkeeper install` renders. A pull request's other changes, an Intel-only build break among them, show here only
# after the merge to main.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested tarball to the npm registry
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Paths apply in order, so `!archive/**` comes last: an archived Cargo.toml does not run it.
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - rust-toolchain.toml
      - "package*.json"
      - "npm/**"
      - "scripts/npm/**"
      - "plugin*/**"
      - README.md
      - LICENSE
      - .github/workflows/release.yml
      - "!archive/**"
  push:
    branches: [main]
    paths: ["**", "!**.md", "README.md", "!archive/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pack:
    # As in studio.yml: a draft pull request skips, and `smoke` and `publish` after it.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache-workspaces: . -> target
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - run: npm run pack:npm -- out
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: out/*.tgz
          if-no-files-found: error

  smoke:
    needs: pack
    strategy:
      matrix:
        # Apple silicon and Intel.
        runner: [macos-latest, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: out
      # The script keeps the runner's Rust off the PATH, as on a Mac with no Rust toolchain.
      - run: sh scripts/npm/smoke.sh out/*.tgz

  publish:
    needs: smoke
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # npm trusted publishing authenticates through the job's OIDC token, and npm's provenance statement needs it.
      id-token: write
    steps:
      # No `registry-url`: npm's default registry is npmjs.org, and setup-node would write an `.npmrc` that sends
      # `NODE_AUTH_TOKEN`, a token this job does not have.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Trusted publishing needs npm 11.5.1 or later; Node 22's npm is 10.
      - run: npm install -g npm@^11.5.1
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: out
      # The tarball the smoke job tested, not a rebuild. No token: npm trusted publishing, configured on npmjs.com for
      # this repository's release.yml, authenticates it (docs/studio/development.md, "Cutting a release").
      # `./`: npm reads a bare `out/plotkeeper-<version>.tgz` as the GitHub repository `out/plotkeeper-<version>.tgz`
      # and fails in `git ls-remote` (#441's first workflow publish, run 45486175800).
      - run: npm publish ./out/*.tgz --provenance --access public
