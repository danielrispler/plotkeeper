name: Studio checks

on:
  pull_request:
  # `issue-*` covers integration branches, which take merges with no pull request.
  push:
    branches: [main, "issue-*"]

# A new push cancels the older run on its branch or pull request; every main commit runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  macos:
    # The studio is a Tauri app built and used on macOS only.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # Reads rust-toolchain.toml; caches cargo's registry and target.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache-workspaces: . -> target
      - run: npm ci
      # The same command an agent runs locally (package.json, `check`).
      - run: npm run check
