name: Studio checks

# A change to Markdown files alone skips the checks; README.md still runs them, as `ui/tests/readme.test.mjs` reads it.
on:
  pull_request:
    paths: ["**", "!**.md", "README.md"]
  # `issue-*` covers integration branches, which take merges with no pull request.
  push:
    branches: [main, "issue-*"]
    paths: ["**", "!**.md", "README.md"]

# A new push cancels the older run on its branch or pull request; every main commit runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  macos:
    # The studio is a Tauri app built and used on macOS only.
    # A pull request from an `issue-*` branch skips both jobs: the push to that branch already runs them.
    if: github.event_name == 'push' || !startsWith(github.head_ref, 'issue-')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # Reads rust-toolchain.toml; caches cargo's registry and target.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache-workspaces: . -> target
      # `check` runs the Rust tests with nextest, then type-checks the wire samples they wrote (`scripts/wire/`, #246).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: npm ci
      # The same command an agent runs locally (package.json, `check`).
      - run: npm run check

  # Every snap fixture rendered in the runner's Chrome; it fails on an uncaught page error. Left out of `check`,
  # which stays fast for agents running it in parallel (#144), and a job of its own, as it needs only the built UI.
  snap:
    if: github.event_name == 'push' || !startsWith(github.head_ref, 'issue-')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run snap:all
