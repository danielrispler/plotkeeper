<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>Plotkeeper</title>
  <!-- Dark from the first paint, and the browser's frame in the top bar's tone, --chrome (#455). -->
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0e0f11">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/marked.umd.js"></script>
  <script type="module" src="main.js"></script>
</head>
<body data-layout="full" class="map-open">
  <!-- The page's structure (#461): a heading for the page, hidden but read, and a link, shown on focus and first in the tab order, that
       jumps past the session list into the map, the page's main content. -->
  <h1 class="visually-hidden">plotkeeper</h1>
  <a id="skip-link" class="skip-link" href="#map">Skip to the map</a>
  <!-- Treatment C's frame (#386): a 34 px top bar over the map and the session list at the right. The grid runs right to left. -->
  <div class="app">
    <header class="top">
      <!-- The top bar (#386): the shown project's name, the Needs you chip and the gear; the map takes the rest. -->
      <span id="bar-project" class="bar-project">plotkeeper</span>
      <span class="sp"></span>
      <!-- How many sessions need Daniel (danielrispler/Falinks#572), anywhere, shown whenever any do; it selects the first. -->
      <button id="needs-you" class="btn small chip" type="button" hidden></button>
      <!-- Settings (#385): a quiet gear that opens the Settings panel over the map, which holds the writer section (#387); the palette's `studio::ShowSettings` does too. -->
      <button id="settings-button" class="btn quiet small gear" type="button" aria-label="Settings" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v1.6M8 12.6v1.6M1.8 8h1.6M12.6 8h1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M3.6 12.4l1.1-1.1M11.3 4.7l1.1-1.1"/></svg></button>
    </header>

    <nav class="list" aria-label="Sessions">
      <div class="full">
        <div id="groups"></div>
        <!-- A project header's "⋯" (#381): `list.ts` opens it under the header it was pressed on. -->
        <div id="project-actions" class="menu project-actions" popover>
          <button id="remove-project" class="btn small" type="button">Remove project</button>
        </div>
        <!-- "History · N" (#94): the ended sessions, which are not in the list. -->
        <div class="list-foot">
          <div id="history-link"></div>
        </div>
      </div>
      <div id="strip" class="strip"></div>
    </nav>

    <!-- The palette (danielrispler/Falinks#575): every action, filtered by what Daniel types; a native popover with a close button (#458). -->
    <dialog id="palette" class="picker" popover aria-label="Palette"></dialog>

    <aside class="rail" aria-label="Session story">
      <!-- Two lines (#444). Line 1: the agent's logo, the session's name on one line, cut by CSS with "…" (the full name stays in the page
           and is its hover text), then "⋯". Line 2, muted: the verdict, the block's kind, the permission mode unless default
           (danielrispler/Falinks#541), always shown, and the phase (danielrispler/Falinks#475); the times (danielrispler/Falinks#473) and the
           model show on hover. Rename, Mark unseen and Delete wait in the "⋯" menu. -->
      <div class="rail-h">
        <div id="headline" class="headline">
          <p class="line-1"><span id="mark" class="mark"></span><span id="session-name" class="session-name"></span></p>
          <p class="line-2"><span id="state" class="state"></span><span id="block" class="block"></span><span id="mode" class="mode"></span><span id="phase" class="phase"></span></p>
        </div>
        <button id="rail-more" class="btn small" type="button" popovertarget="rail-actions" aria-label="More actions" hidden>⋯</button>
        <div id="rail-actions" class="menu" popover>
          <!-- Rename and close (danielrispler/Falinks#469). -->
          <button id="rename" class="btn small" type="button" hidden>Rename</button>
          <!-- Unseen (danielrispler/Falinks#556): the row's mark comes back until Daniel selects it again. -->
          <button id="mark-unseen" class="btn small" type="button" hidden>Mark unseen</button>
          <button id="delete" class="btn small" type="button" hidden>Delete</button>
        </div>
      </div>
      <!-- "Now" starts with the open question, docked so it never scrolls away. -->
      <div id="dock" class="dock" hidden></div>
      <div id="story" class="story">
        <div class="notice-row">
          <p id="notice" role="status" hidden></p>
          <button id="notice-dismiss" class="btn small" type="button">Dismiss</button>
        </div>
        <!-- With no session picked, the rail says what will show there (#526). -->
        <div id="empty" class="rail-empty">
          <p class="empty">Pick a session in the list.</p>
          <p class="empty">Its story shows here: what it is doing, and each finished turn.</p>
        </div>
        <section id="view" hidden>
          <!-- While running: what Daniel asked. At your turn it is in the newest turn's block (danielrispler/plotkeeper#116). -->
          <section id="now-asked"></section>
          <!-- The intention, boxed as the anchor (mockup C), the step line (danielrispler/Falinks#472) and a Wait tip (#523). -->
          <div id="intention" class="intention">
            <p id="intention-label" class="label" hidden>Why it asks</p>
            <p><span id="intention-text"></span> <span id="intention-age" class="age"></span></p>
            <details id="unavailable" class="unavailable" hidden><summary id="unavailable-summary">Steps only</summary><span id="unavailable-why"></span></details>
            <details id="step" class="step"><summary id="step-line"><span id="tool" class="tool-name"></span> <span id="detail"></span></summary><code id="command"></code></details>
            <!-- A Wait tip (#523): while the session runs, one muted line under the step teaches one feature. -->
            <p id="tip" class="tip" hidden></p>
          </div>
          <!-- The feed of turns, newest first, the first being "now" at your turn: each with its prompt, Headline, cards,
               subagents (danielrispler/Falinks#535), checks and folded response. -->
          <section id="banner-slot"></section>
          <ol id="feed" class="feed"></ol>
          <details id="brief-fold" class="decisions" hidden><summary id="brief-summary">Brief</summary><section id="brief" class="brief"></section></details>
          <!-- Decision history (danielrispler/Falinks#479), folded under the feed. -->
          <details id="decisions" class="decisions" hidden><summary id="decisions-title"></summary><ol id="decisions-list"></ol></details>
        </section>
      </div>
    </aside>

    <!-- The Map view (danielrispler/plotkeeper#306), the page's base (#386): a project's map beside the session list, whose headers switch it.
         `map.ts` draws it. Over the map float the tray, the left panel and the side area (the sheet, the drawer, the not-placed line). -->
    <main id="map" class="map-view" aria-label="Map" tabindex="-1">
      <header class="map-head">
        <span id="map-ref" class="map-ref"></span>
        <!-- Pre-flight (#394): the parts a piece of work will likely cross; the palette's `studio::PreFlight` opens it too. -->
        <button id="pre-flight-button" class="btn quiet small" type="button">Pre-flight</button>
        <!-- Fit (#669): the whole map back in view, as the palette's `studio::FitMap` and its key do. -->
        <button id="fit-map-button" class="btn quiet small" type="button">Fit</button>
        <!-- Keep it current (#766): a card of two snippets for the agent instructions and CI; `map-keep.ts` fills it, after Accept or on this button. -->
        <button id="keep-current-button" class="btn quiet small" type="button" aria-controls="map-keep" aria-expanded="false" hidden>Keep it current</button>
        <div id="map-review" class="map-review" hidden></div>
        <!-- Not recording (#437): while no agent is wired, in the head the base view always shows, never in the story's notice line. -->
        <p id="map-wiring" class="map-wiring" role="status" hidden></p>
        <div id="map-banner" class="map-banner"></div>
        <!-- The ways forward of a map whose draft PR closed unmerged, "Map not in the repo" (#765): `map.ts` fills it. -->
        <div id="map-pending" class="map-pending" hidden></div>
        <section id="map-keep" class="map-keep" aria-label="Keep it current" hidden></section>
        <!-- The check's problems of a map read from the checkout, not committed yet (#753): `map.ts` fills it. -->
        <div id="map-problems" class="map-problems" role="status" hidden></div>
      </header>
      <div class="map-stage">
        <div id="map-body" class="map-body"></div>
        <!-- The PR brief (#339): over the foot of the map body while one plays; `map-brief.ts` fills it. -->
        <section id="map-brief" class="map-brief" aria-label="PR brief" hidden></section>
        <!-- The pre-flight (#394): an overlay over the map in the glass, the first layer Esc closes; `map-pre-flight.ts` fills it. -->
        <section id="map-pre-flight" class="map-pre-flight glass" role="dialog" aria-label="Pre-flight" hidden></section>
        <!-- A micro-world (#399): its checked page in a sandboxed frame, in a wide overlay in the glass, the first layer Esc closes; `micro-world.ts` fills it. -->
        <section id="map-micro-world" class="map-micro-world glass" role="dialog" aria-label="Micro-world" hidden></section>
        <!-- The patch review of back a law (#398): an overlay over the map in the glass, closed by Esc after the pre-flight; `patch-review.ts` fills it. -->
        <section id="map-patch-review" class="map-patch-review glass" role="dialog" aria-label="Patch review" hidden></section>
        <!-- Ready for review (#336), over the map's foot on the left; hidden while the left panel is open (#666). -->
        <section id="map-tray" class="map-tray glass"></section>
        <!-- The left panel (#385): a session's story (the rail, moved in), History, a turn's diff (widened) or Settings, floating over the map
             in the part sheet's glass; `panel.ts` fills it. It never darkens the map. -->
        <section id="map-panel" class="map-panel glass" aria-label="Panel" hidden>
          <button id="panel-close" class="btn quiet panel-close" type="button" aria-label="Close">×</button>
          <div id="panel-body" class="panel-body"></div>
        </section>
        <!-- The right side, floating over the map: the line for the sessions that need you and no part holds, then the part's sheet and the drawer under it, each in the same glass,
             then the background runs (#390). The sessions come first, so their list keeps the map's top right whether a sheet is open or not, and a
             sheet never pushes it down over a part (#466). -->
        <!-- A session badge's list (#562): its sessions and their Workers, a popover placed by the badge that opened it; `map-agents.ts` fills it.
             It is outside the map's world, so a press in it never reaches a plate. -->
        <dialog id="map-badge-list" class="badge-list" popover="auto" aria-label="Sessions on this part"></dialog>
        <aside id="map-side" class="map-side" aria-label="Beside the map" hidden>
          <section id="map-not-placed"></section>
          <section id="map-sheet" class="glass"></section>
          <section id="map-drawer" class="glass"></section>
          <section id="map-runs" class="glass"></section>
        </aside>
      </div>
      <footer id="map-legend" class="map-legend"></footer>
      <!-- The toasts (#457), manual popovers in one region (a named section): the needs-you toast (danielrispler/Falinks#573) over the map's top-right
           corner, under it the note toast, for a turn that ended off screen, under that the copy toast (#493), for a prompt copied for the agent,
           under that the what's-new toast (#527), after an update, and the Clear toast in the bottom-left corner. While the side area shows, the
           first four stand against its left edge instead (#666). -->
      <section id="toasts" class="toasts" aria-label="Notifications">
        <div id="toast" class="toast" popover="manual" hidden></div>
        <div id="note-toast" class="toast note" popover="manual" hidden></div>
        <div id="copy-toast" class="toast note copy" popover="manual" hidden></div>
        <div id="whats-new-toast" class="toast note whats-new" popover="manual" hidden></div>
        <div id="clear-toast" class="toast start clear" popover="manual" hidden></div>
      </section>
    </main>
  </div>
  <!-- The questions of rename and close (danielrispler/Falinks#469). -->
  <dialog id="rename-dialog" class="ask" aria-labelledby="rename-heading">
    <form method="dialog">
      <h2 id="rename-heading" class="ask-title">Rename session</h2>
      <label for="rename-field">Name this session</label>
      <input id="rename-field" name="session-name" autocomplete="off" spellcheck="false" autofocus>
      <!-- The default button comes first, so Enter in the field renames. -->
      <div class="ask-buttons"><button id="rename-dialog-save" type="submit" class="btn" value="rename">Rename</button><button id="rename-dialog-cancel" type="submit" class="btn" value="cancel">Cancel</button></div>
    </form>
  </dialog>
  <!-- Delete: the row leaves the list; its cards are kept. -->
  <dialog id="delete-dialog" class="ask" aria-labelledby="delete-heading">
    <form method="dialog">
      <h2 id="delete-heading" class="ask-title">Delete session?</h2>
      <p>Delete <strong id="delete-name"></strong> from the list? Its cards are kept.</p>
      <div class="ask-buttons"><button id="delete-dialog-delete" type="submit" class="btn" value="delete">Delete</button><button id="delete-dialog-cancel" type="submit" class="btn" value="cancel" autofocus>Cancel</button></div>
    </form>
  </dialog>
  <!-- A confirm before a button destroys something (#459): its heading, what is lost and the verb come from \`confirmed\` in dom.ts. -->
  <dialog id="confirm-dialog" class="ask" aria-labelledby="confirm-heading">
    <form method="dialog">
      <h2 id="confirm-heading" class="ask-heading">Go ahead?</h2>
      <p id="confirm-lost"></p>
      <div class="ask-buttons"><button type="submit" class="btn" id="confirm-yes" value="confirm">Go ahead</button><button id="confirm-dialog-cancel" type="submit" class="btn" value="cancel" autofocus>Cancel</button></div>
    </form>
  </dialog>
  <!-- The page's hints (spec #582): each trigger's own `popover="hint"`, made by `hint()` in dom.ts. -->
  <div id="hints"></div>
</body>
</html>
