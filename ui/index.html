<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>Plotkeeper</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/marked.umd.js"></script>
  <script type="module" src="main.js"></script>
</head>
<body data-layout="full">
  <!-- The grid runs right to left: the list on the right, Home, History or a diff in the centre, the rail on the left. -->
  <div class="app">
    <header class="top">
      <!-- The top bar (danielrispler/plotkeeper#127): the session's header first; a click toggles the rail. Its state is the one the rail's header shows. -->
      <button id="session-header" class="btn quiet session-header" type="button" aria-label="Session story" hidden><span id="bar-dot" class="dot"></span><span id="bar-state" class="state"></span><span id="bar-name" class="name"></span></button>
      <!-- How many sessions need Daniel (danielrispler/Falinks#572), anywhere, shown whenever any do; it selects the first. -->
      <button id="needs-you" class="btn small chip" type="button" hidden></button>
      <!-- How many sessions finished a turn Daniel has not seen, not in colour; it selects the newest. -->
      <button id="unseen" class="btn small chip unseen" type="button" hidden></button>
    </header>

    <nav class="list" aria-label="Sessions">
      <div class="full">
        <p id="no-sessions" class="empty">No session yet.</p>
        <div id="groups"></div>
        <!-- A project header's "⋯" (#381): `list.ts` opens it under the header it was pressed on. -->
        <div id="project-actions" class="menu project-actions" popover>
          <button id="remove-project" class="btn small" type="button" title="Take this project off the list; its sessions stay in History">Remove project</button>
        </div>
        <!-- "History · N" (#94): the ended sessions, which are not in the list. -->
        <div class="list-foot">
          <div id="history-link"></div>
        </div>
      </div>
      <div id="strip" class="strip"></div>
    </nav>

    <!-- The palette (danielrispler/Falinks#575): every action, filtered by what Daniel types. -->
    <div id="palette" class="picker" role="dialog" aria-label="Palette" hidden></div>

    <!-- The centre column (danielrispler/Falinks#467): Home, History, a diff or a subagent's log; `panes.ts` draws it. -->
    <section id="centre" class="term" aria-label="Centre">
      <div id="column" class="term-body"></div>
      <!-- The needs-you toast (danielrispler/Falinks#573) over the centre column's top-right corner, and under it the note toast, for a
           turn that ended off screen or a context warning; never focused. -->
      <div class="toasts">
        <div id="toast" class="toast" role="status" hidden></div>
        <div id="note-toast" class="toast note" role="status" hidden></div>
      </div>
      <div id="clear-toast" class="toast start clear" role="status" hidden></div>
    </section>

    <!-- The rail's spine (danielrispler/plotkeeper#128): in the overlay layout, resting on it opens the rail; it shows the session's state. -->
    <div id="spine" class="spine" title="Open the session's story" hidden><span id="spine-dot" class="dot"></span></div>

    <aside class="rail" aria-label="Session story">
      <!-- One line (danielrispler/Falinks#574): the verdict, the permission mode unless default (danielrispler/Falinks#541), always shown, and
           the phase (danielrispler/Falinks#475); the times (danielrispler/Falinks#473) and the model show on hover. Rename, Close and Delete
           wait in the "⋯" menu. -->
      <div class="rail-h">
        <div id="headline" class="headline">
          <p class="line-1"><span id="state" class="state"></span> <span id="block" class="block"></span> <span id="mode" class="mode"></span> <span id="mark" class="mark"></span></p>
          <p id="session-name" class="session-name"></p>
          <p id="phase" class="phase"></p>
        </div>
        <button id="rail-more" class="btn small" type="button" popovertarget="rail-actions" aria-label="More actions" title="Rename, mark unseen, close or delete this session" hidden>⋯</button>
        <div id="rail-actions" class="menu" popover>
          <!-- Rename and close (danielrispler/Falinks#469). -->
          <button id="rename" class="btn small" type="button" title="Give this session a name of your own" hidden>Rename</button>
          <!-- Unseen (danielrispler/Falinks#556): the row's mark comes back until Daniel selects it again. -->
          <button id="mark-unseen" class="btn small" type="button" title="Mark this session unseen, to come back to it" hidden>Mark unseen</button>
          <button id="open-all" class="btn small" type="button" title="Unfold every turn and section in the story">Open all</button>
          <button id="close-all" class="btn small" type="button" title="Fold every turn and section in the story">Close all</button>
          <button id="delete" class="btn small" type="button" title="Remove this session from the list; its cards are kept" hidden>Delete</button>
        </div>
      </div>
      <!-- "Now" starts with the open question, docked so it never scrolls away. -->
      <div id="dock" class="dock" hidden></div>
      <div id="story" class="story">
        <div class="notice-row">
          <p id="notice" role="status" hidden></p>
          <button id="notice-dismiss" class="btn small" type="button" title="Hide this notice">Dismiss</button>
        </div>
        <p id="empty" class="empty">Pick a session in the list.</p>
        <section id="view" hidden>
          <!-- While running: what Daniel asked. At your turn it is in the newest turn's block (danielrispler/plotkeeper#116). -->
          <section id="now-asked"></section>
          <!-- The intention, boxed as the anchor (mockup C), and the step line (danielrispler/Falinks#472). -->
          <div id="intention" class="intention">
            <p id="intention-label" class="label" hidden>Why it asks</p>
            <p><span id="intention-text"></span> <span id="intention-age" class="age"></span></p>
            <details id="unavailable" class="unavailable" hidden><summary title="Why only the steps are shown">Steps only</summary><span id="unavailable-why"></span></details>
            <details id="step" class="step"><summary id="step-line" title="The step the agent is on"><span id="tool" class="tool-name"></span> <span id="detail"></span></summary><code id="command"></code></details>
          </div>
          <!-- The feed of turns, newest first, the first being "now" at your turn: each with its prompt, Headline, cards,
               subagents (danielrispler/Falinks#535), checks and folded response. -->
          <section id="banner-slot"></section>
          <ol id="feed" class="feed"></ol>
          <details id="brief-fold" class="decisions" hidden><summary title="Show or hide the Brief: where the session stands">Brief</summary><section id="brief" class="brief"></section></details>
          <!-- Decision history (danielrispler/Falinks#479), folded under the feed. -->
          <details id="decisions" class="decisions" hidden><summary id="decisions-title" title="Show or hide the decisions made in this session"></summary><ol id="decisions-list"></ol></details>
        </section>
      </div>
    </aside>

    <!-- The Map view (danielrispler/plotkeeper#306): over the rail's and the terminal's columns, which it hides; the list and the top bar
         stay live. `map.ts` draws it. The side area is for the sheet, the drawer and the not-placed list of later tickets. -->
    <section id="map" class="map-view" aria-label="Map" hidden>
      <header class="map-head">
        <button id="map-project" class="btn quiet map-project" type="button" popovertarget="map-projects" aria-label="Project" title="Show another project's map"></button>
        <div id="map-projects" class="menu map-projects" popover></div>
        <span id="map-ref" class="map-ref"></span>
        <div id="map-review" class="map-review" hidden></div>
        <div id="map-banner" class="map-banner"></div>
      </header>
      <div class="map-stage">
        <div id="map-body" class="map-body"></div>
        <!-- The PR brief (#339): over the foot of the map body while one plays; `map-brief.ts` fills it. -->
        <section id="map-brief" class="map-brief" aria-label="PR brief" hidden></section>
        <aside id="map-side" class="map-side" aria-label="Beside the map" hidden>
          <section id="map-not-placed"></section>
          <section id="map-tray"></section>
          <section id="map-sheet"></section>
          <section id="map-drawer"></section>
        </aside>
      </div>
      <footer id="map-legend" class="map-legend"></footer>
    </section>
  </div>
  <!-- The dividers: drag to resize the list and the rail. -->
  <div id="list-divider" class="divider" role="separator" aria-orientation="vertical" aria-label="Resize the session list"></div>
  <div id="rail-divider" class="divider" role="separator" aria-orientation="vertical" aria-label="Resize the story rail"></div>
  <!-- The questions of rename and close (danielrispler/Falinks#469). -->
  <dialog id="rename-dialog" class="ask">
    <form method="dialog">
      <label for="rename-field">Name this session</label>
      <input id="rename-field" autocomplete="off" spellcheck="false" autofocus>
      <!-- The default button comes first, so Enter in the field renames. -->
      <div class="ask-buttons"><button class="btn" value="rename" title="Save this name (↩)">Rename</button><button class="btn" value="cancel" title="Keep the old name (Esc)">Cancel</button></div>
    </form>
  </dialog>
  <!-- Delete: the row leaves the list; its cards are kept. -->
  <dialog id="delete-dialog" class="ask">
    <form method="dialog">
      <p>Delete <strong id="delete-name"></strong> from the list? Its cards are kept.</p>
      <div class="ask-buttons"><button class="btn" value="delete" title="Remove it from the list">Delete</button><button class="btn" value="cancel" autofocus title="Keep it (Esc)">Cancel</button></div>
    </form>
  </dialog>
  <span id="probe" aria-hidden="true">MMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMM</span>
</body>
</html>
