[package]
name = "studio-understanding"
version = "0.0.0"
edition = "2024"
publish = false
# One test binary, `tests/main.rs`, that declares every file beside it.
autotests = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The API-key writers' HTTP path: a blocking client, so the server pulls in no async runtime.
ureq = { version = "2.12", default-features = false, features = ["tls"] }
similar = "3"
studio-core = { path = "../core" }
# The weekly command finds the event log.
studio-hook = { path = "../hook" }
# The brief's facts place a PR's files by the map.
studio-system-map = { path = "../system-map" }

[dev-dependencies]
studio-test-support = { path = "../test-support" }
tempfile = "3"
# The fake HTTP server the API-key writers are tested against.
tiny_http = "0.12"

[[test]]
name = "it"
path = "tests/main.rs"
