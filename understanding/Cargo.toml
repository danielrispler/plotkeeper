[package]
name = "studio-understanding"
version = "0.0.0"
edition = "2024"
publish = false
# One test binary, `tests/main.rs`, that declares every file beside it.
autotests = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
studio-core = { path = "../core" }
# The weekly command finds the card store beside the event log.
studio-hook = { path = "../hook" }

[dev-dependencies]
studio-test-support = { path = "../test-support" }
tempfile = "3"

# Its timing summary has unit tests, which `cargo test` runs without a model call.
[[example]]
name = "writer_timing"
test = true

[[test]]
name = "it"
path = "tests/main.rs"
