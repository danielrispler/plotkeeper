# The studio's own workspace, kept apart from the engine's (danielrispler/Falinks#328, "Where the code lives").
[workspace]
members = ["core", "wayfinder", "hook", "understanding", "terminal-daemon", "workbench", "src-tauri", "test-support"]
# The shell embeds the built frontend (`dist/`) at compile time, so plain `cargo test` leaves it out;
# `npm run tauri build` builds it.
default-members = ["core", "wayfinder", "hook", "understanding", "terminal-daemon", "workbench"]
resolver = "3"

# Lighter debug info links faster; line tables keep file and line in backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Parses the big fixtures in the replay tests.
[profile.dev.package.serde_json]
opt-level = 3
