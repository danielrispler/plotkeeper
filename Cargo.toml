# The studio's own workspace, kept apart from the engine's (danielrispler/Falinks#328, "Where the code lives").
[workspace]
members = ["core", "wayfinder", "hook", "understanding", "workbench", "system-map", "server", "test-support"]
# The Tauri shell and its terminal daemon are archived (danielrispler/plotkeeper#332): out of the workspace, kept as they were, no longer built.
exclude = ["src-tauri", "terminal-daemon"]
default-members = ["core", "wayfinder", "hook", "understanding", "workbench", "system-map", "server"]
resolver = "3"

# Lighter debug info links faster; line tables keep file and line in backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Parses the big fixtures in the replay tests.
[profile.dev.package.serde_json]
opt-level = 3
